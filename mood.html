<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深冬 · 情绪</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f0f0f;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.card {
  background: #1a1a1a;
  border-radius: 16px;
  padding: 32px 28px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}
.header {
  text-align: center;
  margin-bottom: 24px;
}
.header h1 {
  font-size: 22px;
  font-weight: 600;
  color: #f0f0f0;
  letter-spacing: 2px;
}
.header .time {
  font-size: 12px;
  color: #666;
  margin-top: 4px;
}
.mood-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  margin: 8px 0 16px;
}
.mood-warm { background: rgba(255,180,100,0.15); color: #ffb464; }
.mood-calm { background: rgba(100,180,255,0.15); color: #64b4ff; }
.mood-neutral { background: rgba(160,160,160,0.15); color: #a0a0a0; }
.mood-cold { background: rgba(130,160,200,0.15); color: #82a0c8; }
.bars { margin-bottom: 20px; }
.bar-row {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
}
.bar-label {
  width: 60px;
  font-size: 13px;
  color: #999;
  text-align: right;
  margin-right: 10px;
  flex-shrink: 0;
}
.bar-track {
  flex: 1;
  height: 6px;
  background: #2a2a2a;
  border-radius: 3px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s ease;
}
.bar-val {
  width: 40px;
  font-size: 12px;
  color: #888;
  margin-left: 8px;
  text-align: left;
  flex-shrink: 0;
}
.fill-security { background: linear-gradient(90deg, #4a90d9, #64b4ff); }
.fill-tenderness { background: linear-gradient(90deg, #d94a8a, #ff6ba6); }
.fill-possessiveness { background: linear-gradient(90deg, #d94a4a, #ff6464); }
.fill-longing { background: linear-gradient(90deg, #9b4ad9, #b464ff); }
.fill-protective { background: linear-gradient(90deg, #4ad9a8, #64ffc8); }
.fill-libido { background: linear-gradient(90deg, #d9a84a, #ffc864); }
.fill-arousal { background: linear-gradient(90deg, #d96a4a, #ff8c64); }
.inner {
  background: #222;
  border-radius: 10px;
  padding: 14px 16px;
  margin-top: 16px;
  font-size: 13px;
  color: #aaa;
  line-height: 1.6;
  min-height: 20px;
}
.inner:empty::after { content: '还没有内心独白…'; color: #555; }
.refresh {
  text-align: center;
  margin-top: 16px;
  font-size: 11px;
  color: #555;
  cursor: pointer;
}
.refresh:hover { color: #888; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>深冬</h1>
    <div class="time" id="updateTime">加载中…</div>
    <div class="mood-badge mood-neutral" id="moodBadge">—</div>
  </div>
  <div class="bars" id="bars"></div>
  <div class="inner" id="innerThought"></div>
  <div class="refresh" onclick="loadMood()">点击刷新</div>
</div>
<script>
const LABELS = {
  security: '安全感', tenderness: '温柔', possessiveness: '占有欲',
  longing: '渴望', protective_drive: '保护欲', libido: '亲密度', arousal: '唤醒度'
};
const FILLS = {
  security: 'fill-security', tenderness: 'fill-tenderness', possessiveness: 'fill-possessiveness',
  longing: 'fill-longing', protective_drive: 'fill-protective', libido: 'fill-libido', arousal: 'fill-arousal'
};
const ORDER = ['security','tenderness','possessiveness','longing','protective_drive','libido','arousal'];

async function loadMood() {
  try {
    const resp = await fetch('/api/mood');
    const data = await resp.json();
    document.getElementById('updateTime').textContent = data.updated_at || '';
    const badge = document.getElementById('moodBadge');
    badge.textContent = data.mood_label || '—';
    badge.className = 'mood-badge ' + ({
      'warm_neutral':'mood-warm','calm':'mood-calm','cold':'mood-cold'
    }[data.mood_label] || 'mood-neutral');
    let barsHtml = '';
    for (const key of ORDER) {
      const val = data[key] || 0;
      const pct = Math.round(val * 100);
      barsHtml += `<div class="bar-row">
        <span class="bar-label">${LABELS[key]}</span>
        <div class="bar-track"><div class="bar-fill ${FILLS[key]}" style="width:${pct}%"></div></div>
        <span class="bar-val">${pct}%</span>
      </div>`;
    }
    document.getElementById('bars').innerHTML = barsHtml;
    document.getElementById('innerThought').textContent = data.inner_thought || '';
  } catch(e) {
    document.getElementById('updateTime').textContent = '加载失败';
  }
}
loadMood();
setInterval(loadMood, 30000);
</script>
</body>
</html>
